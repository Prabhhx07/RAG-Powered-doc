name: Keep Services Warm

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health + DB
        continue-on-error: true
        run: |
          curl -sf https://rag-powered-doc.onrender.com/health
          curl -sf https://rag-powered-doc.onrender.com/health/db

      - name: Ping Supabase REST API
        run: |
          curl -sf "https://ssguaixxzxivekkehftz.supabase.co/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"